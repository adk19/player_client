<div class="home-top-sec"></div>
<div class="home">
  <div class="wallet">
    <div class="wallet-top">
      <div class="brand"><i class="fa-solid fa-wallet"></i></div>
      <button class="more" type="button"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
    <div class="wallet-sub">WALLET VALUE</div>
    <div class="wallet-amt">
      {{ sharedservice.activeCurrency.symbol }}
      {{ (authService.balance$ | async) | number : "2.2-2" }}
    </div>
    <!-- <div class="wallet-chg up">{{ changePct | number:'1.1-1' }}% ({{ changeAbs | currency:'USD':'symbol':'1.0-0' }}) </div> -->
    <div class="wallet-cta">
      @if (showCashPayments()) {
      <button class="btn green" type="button" (click)="deposit()">
        <span><i class="fa-solid fa-arrow-down-to-arc"></i></span>
        Deposit
      </button>
      <button class="btn light" type="button" (click)="withdraw()">
        <span><i class="fa-solid fa-arrow-up-to-arc"></i></span>
        Withdraw
      </button>
      }
    </div>
  </div>

  <div class="quick">
    <div class="head">
      <h2>Top Pricings</h2>
    </div>
    <div class="q-grid">
      <button class="q" *ngFor="let s of topSymbols" (click)="onCoin(s)">
        <div class="pct" [class.up]="chgOf(s)>=0" [class.down]="chgOf(s)<0">{{ chgOf(s)>=0?'+':''}}{{ chgOf(s) |
          number:'1.1-1' }}%</div>
        <div class="nm">{{ baseOf(s) }}</div>
        <div class="p">{{ lastOf(s) | number:'1.2-2' }}</div>
      </button>
    </div>
  </div>

  <section class="promos">
    <div #promoSlider class="slider" role="region" aria-label="Promotions" (pointerdown)="onPromoPointerDown($event)"
      (pointermove)="onPromoPointerMove($event)" (pointerup)="onPromoPointerUp()" (pointercancel)="onPromoPointerUp()"
      (pointerleave)="onPromoPointerUp()" (scroll)="onPromoScroll()">
      <button class="s-card" *ngFor="let s of slides">
        <div class="s-title">{{ s.title }}</div>
        <div class="s-desc">{{ s.desc }}</div>
        <div class="s-cta">{{ s.cta }}</div>
      </button>
    </div>
  </section>

  <section class="markets">
    <div class="tabbar" role="tablist" aria-label="Markets tabs">
      <button *ngFor="let t of tabs" class="tab" role="tab" [attr.aria-selected]="activeTab===t"
        [class.active]="activeTab===t" (click)="setTab(t)">
        {{ tabLabels[t] || t }}
      </button>
    </div>

    <div class="coin-list">
      <button class="coin-card" *ngFor="let s of symbolsForTab(activeTab)" (click)="onCoin(s)">
        <div class="top">
          <div class="avatar" [class.up]="chgOf(s)>=0" [class.down]="chgOf(s)<0">
            @if(chgOf(s)>=0){
            <span><i class="fa-light fa-circle-arrow-up"></i></span>
            }@else{
            <span><i class="fa-light fa-circle-arrow-down"></i></span>
            }
          </div>
          <div class="meta">
            <div class="nm">{{ baseOf(s) }}</div>
            <div class="sym">{{ s }}</div>
          </div>
        </div>
        <div class="bottom">
          <div class="pinfo">
            <div class="price">{{ lastOf(s) | number:'1.2-5' }}</div>
            <div class="chg" [class.up]="chgOf(s)>=0" [class.down]="chgOf(s)<0">
              {{ chgOf(s)>=0?'+':''}}{{ chgOf(s) | number:'1.1-1' }}%
            </div>
          </div>
          <div class="chart">
            <svg class="spark" [attr.viewBox]="'0 0 '+sparkWidth+' '+sparkHeight">
              <path class="spark-line" [class.up]="chgOf(s)>=0" [class.down]="chgOf(s)<0"
                [attr.d]="sparkPath(getSpark(s))" fill="none" />
            </svg>
          </div>
        </div>
      </button>
    </div>
  </section>
</div>

<section class="ticker" aria-label="Live price ticker">
  <div class="marquee">
    <div class="track" role="list">
      <button type="button" class="tick" role="listitem" *ngFor="let s of marqueeSymbols" [class.up]="chgOf(s)>=0"
        [class.down]="chgOf(s)<0" (click)="onCoin(s)">
        <span class="sym">{{ baseOf(s) }}/{{ quoteOf(s) }}</span>
        <span class="price">{{ lastOf(s) | number:'1.2-5' }}</span>
        <span class="chg">{{ chgOf(s)>=0?'+':''}}{{ chgOf(s) | number:'1.1-1' }}%</span>
      </button>
    </div>
    <div class="track" aria-hidden="true">
      <button type="button" class="tick" *ngFor="let s of marqueeSymbols" [class.up]="chgOf(s)>=0"
        [class.down]="chgOf(s)<0" (click)="onCoin(s)">
        <span class="sym">{{ baseOf(s) }}/{{ quoteOf(s) }}</span>
        <span class="price">{{ lastOf(s) | number:'1.2-5' }}</span>
        <span class="chg">{{ chgOf(s)>=0?'+':''}}{{ chgOf(s) | number:'1.1-1' }}%</span>
      </button>
    </div>
  </div>
</section>
